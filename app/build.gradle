plugins { id 'com.android.application' }
android {
 namespace 'fr.zachiran.robot'
 compileSdk 35
 defaultConfig { applicationId 'fr.zachiran.robot'; minSdk 24; targetSdk 35; versionCode 2; versionName '1.1.0' }
 sourceSets { main { assets.srcDirs = [rootProject.file('docs')] } }
 androidResources { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:downloads:screenshots' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
